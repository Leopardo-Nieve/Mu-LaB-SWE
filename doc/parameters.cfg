[simulation_parameters]
    # the name this current project should be identified as (all raw data will be stored in a directory of the same name)
    # maximum 30 characters
    project_name = convergence2D

    # whether to simulate until reaching a steady state is reached or not
    # if steady define `.true.`, if tidal define `.false.`
    steadyFlow = .true.

    # Maximum simulation time in seconds, set to a large value for steady flow
    simTime = 90000000000.0d0

    # Number of total iterations
#    itera_no = 400000000
    itera_no = 1000
#    itera_no = 10

    # period between checkpoints
    # per_checkpoint_iter [=] number of iterations
    # per_checkpoint_time [=] time in seconds
    # put 0 if you do not want to use checkpoints
    # the larger of the two will be chosen
    per_checkpoint_iter = 0
    per_checkpoint_time = 0

    # Length of domain in x direction in metres
    domainX = 2.0d0

    # Length of domain in y direction in metres
    domainY = 2.0d0

    # Distance between nodes
    dx = 0.02500000d0

    # Time step in seconds
    dt = 1.0416666875d-04

    # Dimensionless relaxation time
    tau = 1.5d0

    # Boundary conditions for a rectangular domain
    # inlet, outlet, wall
    inlet_pos = 'left'
    outlet_pos = 'right'
    wall_pos1 = 'bottom'
    wall_pos2 = 'top'

    # inlet and outlet type of conditions and their value
    # ASSUMPTION: velocity parallel to the boundary, e.g., v for the left boundary, is equal to 0
    # 'h', 'u' or 'q' (depth + bed, velocity or discharge), 'd' or 'n' (Dirichlet or Neumann)
    inlet = 'u' 'd'
    inlet_value = 0.0d0

    outlet = 'h' 'd'
    outlet_value = 5.0d0
    # NB: outlet value is for h + zb, not h



    # value under which the total sum of residuals of every node must be under in order to determine the steady state has been reached
    epsilon = 2.441406d-10

    # consistency criterion to ensure no non-physical behaviour is present at boundaries
    consCriter = 1.0d-3

    # all forcing schemes to choose from "bg": Buick-Greated, "gzs": Guo-Zheng-Shi
    all_forcing_schemes = "BG ", "GZS"

    # forcing scheme chosen
    forcing_scheme = "BG"

[physical_constants]
    # Manning constant
    nb = 0.012d0
